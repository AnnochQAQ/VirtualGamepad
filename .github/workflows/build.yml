name: Build Debug

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: "temurin"
          cache: gradle

      - name: Read NDK version
        id: ndk
        run: |
          version="$(sed -n 's/^libcxx[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' gradle/libs.versions.toml)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install Android NDK
        run: |
          sdkmanager="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -maxdepth 3 -type f -name sdkmanager | sort | tail -n1)"
          "$sdkmanager" --install "ndk;${{ steps.ndk.outputs.version }}"

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build debug (arm64 only)
        run: ./gradlew clean assembleDebug -PabiList=arm64-v8a

      - uses: actions/upload-artifact@v7
        with:
          name: debug-apk-arm64
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error